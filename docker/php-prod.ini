; Production PHP settings (Dockerfile.nas): errors go to the log, never to
; the page -- players shouldn't see file paths or stack traces. The game's
; own log (admin/logs.php) still records them.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /var/log/apache2/php_errors.log
expose_php = Off
